<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <title>Review Demo</title>
  <style>
    :root{
      --bg:#202124;
      --surface:#202124;
      --surface-2:#303134;
      --border:#9aa0a6;
      --text:#e8eaed;
      --muted:#9aa0a6;
      --blue:#8ab4f8;
      --blue-bg:#1a73e8;
      --star:#fbbc04;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:Arial,Roboto,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,textarea{font:inherit}

    .page{
      width:min(100%,680px);
      margin:0 auto;
      padding:54px 32px 24px;
    }

    .business{
      margin:0 0 30px;
      text-align:center;
      color:#bdc1c6;
      font-size:14px;
      font-weight:500;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:34px;
    }

    .avatar-wrap{
      position:relative;
      flex:0 0 auto;
    }

    .avatar{
      width:72px;
      height:72px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#f4511e;
      color:#fff;
      font-size:39px;
      font-weight:400;
      line-height:1;
    }

    .badge{
      position:absolute;
      right:-4px;
      bottom:-2px;
      width:27px;
      height:27px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#fff;
      border:2px solid #202124;
    }

    .badge-star{
      width:19px;
      height:19px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#8ab4f8;
      color:#fff;
      font-size:11px;
      line-height:1;
    }

    .identity{
      min-width:0;
    }

    .name{
      margin:0;
      font-size:24px;
      line-height:1.2;
      font-weight:400;
      color:#f1f3f4;
    }

    .public-line{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:6px;
      color:#9aa0a6;
      font-size:19px;
      line-height:1.3;
    }

    .info{
      width:24px;
      height:24px;
      border:2px solid #9aa0a6;
      border-radius:50%;
      display:inline-grid;
      place-items:center;
      font-size:15px;
      font-weight:700;
      line-height:1;
    }

    .stars{
      display:flex;
      justify-content:flex-start;
      gap:24px;
      margin:0 0 34px 102px;
    }

    .star{
      width:48px;
      height:48px;
      padding:0;
      border:0;
      background:transparent;
      color:#9aa0a6;
      cursor:pointer;
      display:grid;
      place-items:center;
      font-size:49px;
      line-height:1;
      transition:transform .12s ease,color .12s ease;
    }

    .star:hover,
    .star:focus-visible{
      transform:scale(1.05);
      outline:none;
    }

    .star.active{color:var(--star)}

    .review-box{
      width:100%;
      min-height:225px;
      padding:28px 26px;
      border:2px solid #9aa0a6;
      border-radius:8px;
      background:transparent;
      color:#e8eaed;
      resize:vertical;
      outline:none;
      font-size:24px;
      line-height:1.45;
    }

    .review-box::placeholder{color:#bdc1c6;opacity:1}
    .review-box:focus{border-color:#8ab4f8}

    .photo-btn{
      width:100%;
      min-height:72px;
      margin-top:26px;
      border:0;
      border-radius:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      background:#303134;
      color:#aecbfa;
      cursor:pointer;
      font-size:22px;
      font-weight:500;
    }

    .camera{
      width:31px;
      height:31px;
      stroke:#8ab4f8;
      stroke-width:2.2;
      fill:none;
      flex:0 0 auto;
    }

    .post-btn{
      width:100%;
      min-height:68px;
      margin-top:40px;
      border:0;
      border-radius:34px;
      background:#3c4043;
      color:#80868b;
      cursor:not-allowed;
      font-size:21px;
      font-weight:500;
      transition:background .14s ease,color .14s ease;
    }

    .post-btn.enabled{
      background:#8ab4f8;
      color:#202124;
      cursor:pointer;
    }

    .demo-note{
      margin:18px auto 0;
      text-align:center;
      color:#74787d;
      font-size:11px;
      line-height:1.45;
    }

    .toast{
      margin:16px auto 0;
      padding:13px 16px;
      border-radius:6px;
      background:#303134;
      color:#e8eaed;
      font-size:14px;
      box-shadow:0 4px 18px rgba(0,0,0,.35);
      opacity:0;
      transform:translateY(8px);
      pointer-events:none;
      transition:.18s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    @media(max-width:560px){
      .page{padding:38px 22px 22px}
      .business{margin-bottom:24px}
      .avatar{width:62px;height:62px;font-size:33px}
      .badge{width:24px;height:24px}
      .badge-star{width:17px;height:17px;font-size:10px}
      .name{font-size:20px}
      .public-line{font-size:16px;gap:7px}
      .info{width:21px;height:21px;font-size:13px}
      .stars{margin-left:80px;gap:12px;margin-bottom:28px}
      .star{width:43px;height:43px;font-size:43px}
      .review-box{min-height:180px;padding:22px 20px;font-size:19px}
      .photo-btn{min-height:62px;font-size:18px}
      .post-btn{min-height:60px;margin-top:34px;font-size:18px}
    }

    @media(max-width:380px){
      .page{padding-left:16px;padding-right:16px}
      .profile{gap:14px}
      .stars{margin-left:72px;gap:5px}
      .star{width:39px;height:42px;font-size:40px}
      .public-line{font-size:15px}
    }

    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="business">Demo Business</div>

    <section aria-label="Interactive review demo">
      <div class="profile">
        <div class="avatar-wrap" aria-hidden="true">
          <div class="avatar">G</div>
          <div class="badge"><div class="badge-star">★</div></div>
        </div>
        <div class="identity">
          <h1 class="name">Google User</h1>
          <div class="public-line">
            <span>Posting publicly across Google</span>
            <span class="info">i</span>
          </div>
        </div>
      </div>

      <div class="stars" aria-label="Choose a star rating">
        <button class="star" type="button" data-value="1" aria-label="1 star">☆</button>
        <button class="star" type="button" data-value="2" aria-label="2 stars">☆</button>
        <button class="star" type="button" data-value="3" aria-label="3 stars">☆</button>
        <button class="star" type="button" data-value="4" aria-label="4 stars">☆</button>
        <button class="star" type="button" data-value="5" aria-label="5 stars">☆</button>
      </div>

      <textarea
        id="reviewText"
        class="review-box"
        maxlength="500"
        aria-label="Review details"
        placeholder="Share details of your own experience at this place"></textarea>

      <button class="photo-btn" id="photoBtn" type="button">
        <svg class="camera" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6.5 9.3 4h5.4L16 6.5h2.5A2.5 2.5 0 0 1 21 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5V9a2.5 2.5 0 0 1 2.5-2.5H8Z"/>
          <circle cx="12" cy="13" r="3.5"/>
          <path d="M18.5 3v4M16.5 5h4"/>
        </svg>
        <span>Add photos</span>
      </button>

      <button class="post-btn" id="postBtn" type="button" disabled>Post</button>

      <p class="demo-note">Interactive demo only — nothing entered here is submitted or stored.</p>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const stars=[...document.querySelectorAll('.star')];
    const postBtn=document.getElementById('postBtn');
    const photoBtn=document.getElementById('photoBtn');
    const toast=document.getElementById('toast');
    let rating=0;
    let toastTimer;

    function showToast(message){
      clearTimeout(toastTimer);
      toast.textContent=message;
      toast.classList.add('show');
      toastTimer=setTimeout(()=>toast.classList.remove('show'),2600);
    }

    function renderStars(){
      stars.forEach((star,index)=>{
        const active=index<rating;
        star.textContent=active?'★':'☆';
        star.classList.toggle('active',active);
        star.setAttribute('aria-pressed',String(index+1===rating));
      });

      postBtn.disabled=rating===0;
      postBtn.classList.toggle('enabled',rating>0);
    }

    stars.forEach(star=>{
      star.addEventListener('click',()=>{
        rating=Number(star.dataset.value);
        renderStars();
      });
    });

    photoBtn.addEventListener('click',()=>{
      showToast('Photo upload is disabled in this demo.');
    });

    postBtn.addEventListener('click',()=>{
      if(!rating) return;
      showToast('Demo only — your review was not submitted.');
    });

    renderStars();
  </script>
</body>
</html>
